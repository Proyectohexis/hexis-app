name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.x
          cache: npm

      - name: Scan tracked files for high-confidence secrets
        run: node scripts/scan-secrets.cjs --report ci-evidence/secret-scan.json

      - name: Install exact dependencies
        run: npm ci

      - name: Block high and critical dependency advisories
        id: dependency-audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > ci-evidence/npm-audit.json
          audit_exit=$?
          set -e
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const report = JSON.parse(readFileSync('ci-evidence/npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          const summary = [
            '## Dependency audit',
            '',
            `- Critical: ${counts.critical ?? 'unknown'}`,
            `- High: ${counts.high ?? 'unknown'}`,
            `- Moderate: ${counts.moderate ?? 'unknown'}`,
            `- Low: ${counts.low ?? 'unknown'}`,
            '',
            'Gate: high and critical advisories block CI.',
          ].join('\n');
          require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          NODE
          exit "$audit_exit"

      - name: Type-check client core
        run: npm run typecheck:client-core

      - name: Parse source
        run: npm run verify:syntax

      - name: Verify declared dependencies
        run: npm run verify:deps

      - name: Unit tests
        run: npm test

      - name: Expo Doctor
        run: npm run doctor

      - name: UX02 prototype doctor
        run: npm run prototype:ux02:doctor

      - name: UX02 resolved native configuration
        run: npm run prototype:ux02:verify-native-config

      - name: Android production bundle
        run: npm run export:android

      - name: iOS production bundle
        run: npm run export:ios

      - name: UX02 Android isolated prototype bundle
        run: npm run prototype:ux02:export:android

      - name: UX02 iOS isolated prototype bundle
        run: npm run prototype:ux02:export:ios

      - name: Record compact mobile evidence
        shell: bash
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            du -sh dist/android dist/ios dist/prototypes/ux02/android dist/prototypes/ux02/ios
            find dist/android dist/ios dist/prototypes/ux02 -type f -printf '%s %p\n' | sort -nr | sed -n '1,30p'
          } > ci-evidence/mobile-build-summary.txt

      - name: Upload compact mobile CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hexis-mobile-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14

  database-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.x

      - name: Supabase CLI 2.84.2
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Deno 2.8.1
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1
          cache: true

      - name: Check and lint Edge Functions
        run: |
          npm run typecheck:edge
          npm run lint:edge

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Apply migrations from zero
        shell: bash
        run: |
          mkdir -p ci-evidence
          set -o pipefail
          supabase db reset 2>&1 | tee ci-evidence/db-reset.log

      - name: RLS and domain database tests
        shell: bash
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee ci-evidence/pg-tap.log

      - name: Adversarial privacy E2E
        shell: bash
        run: |
          status_file="$RUNNER_TEMP/supabase-status.json"
          trap 'rm -f "$status_file"' EXIT
          supabase status -o json > "$status_file"
          api_url="$(node -e "const s=require(process.argv[1]); process.stdout.write(s.API_URL ?? '')" "$status_file")"
          public_key="$(node -e "const s=require(process.argv[1]); process.stdout.write(s.PUBLISHABLE_KEY || s.ANON_KEY || '')" "$status_file")"
          rm -f "$status_file"
          trap - EXIT
          if [[ -z "$api_url" || -z "$public_key" ]]; then
            echo "Supabase local did not expose API_URL and a public client key." >&2
            exit 1
          fi
          set -o pipefail
          SUPABASE_URL="$api_url" \
            SUPABASE_PUBLISHABLE_KEY="$public_key" \
            npm run test:privacy:e2e 2>&1 | tee ci-evidence/privacy-e2e.log

      - name: Upload compact database CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hexis-database-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14
